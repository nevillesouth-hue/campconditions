name: Build and deploy
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
    # Extra runs so dated closures flip close to the time NPWS gives:
    # 23:02 UTC is 10:02am AEDT (10am reopenings), 03:02 UTC is 2:02pm AEDT (2pm closures).
    - cron: "2 23 * * *"
    - cron: "2 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # A normal build takes a few minutes. Stop a hung one before it eats the free minutes.
    timeout-minutes: 25
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONUNBUFFERED: "1"
      # Parks Victoria page check: at most 4 minutes of fetching per build. Pages
      # are cached for a day between builds, so each build only refreshes the oldest.
      PARKSVIC_FETCH_SECONDS: "240"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep the committed CFA forecast beside any restored cache
        run: |
          if [ -f data/cfa-fdr-cache.json ]; then
            cp data/cfa-fdr-cache.json data/cfa-fdr-cache.committed.json
          fi
      - uses: actions/cache/restore@v4
        with:
          path: data/cfa-fdr-cache.json
          key: cfa-fdr-${{ github.run_id }}
          restore-keys: cfa-fdr-
      - name: Restore Parks Victoria page cache and last good boundary copies
        uses: actions/cache/restore@v4
        with:
          path: |
            data/.parksvic-cache
            data/.last-good
          key: source-pages-${{ github.run_id }}
          restore-keys: source-pages-
      - name: Build from live sources
        # Every state with enabled true in config/states is built. NSW is on.
        run: python3 scripts/build.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/cfa-fdr-cache.json
          key: cfa-fdr-${{ github.run_id }}
      - name: Save Parks Victoria page cache and last good boundary copies
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/.parksvic-cache
            data/.last-good
          key: source-pages-${{ github.run_id }}
      - name: Test (links, JSON-LD, sitemap)
        run: python3 scripts/test.py
      # Keep the built site only when a test fails, for debugging. A 50 MB copy of
      # every good build only used up artifact storage.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dist
          path: dist
          retention-days: 3
      - name: Deploy to Cloudflare Pages
        # Push is already limited to main. workflow_dispatch can select another ref
        # (including newsletter) and would otherwise publish that checkout with --branch=main.
        if: ${{ github.ref == 'refs/heads/main' && env.CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing to deploy ${GITHUB_REF} to the production branch."
            exit 1
          fi
          npx --yes wrangler@3 pages deploy dist --project-name=campconditions --branch=main
