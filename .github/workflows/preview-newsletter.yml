name: Preview newsletter branch
on:
  push:
    branches: [newsletter]
permissions:
  contents: read
concurrency:
  group: preview-newsletter
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/newsletter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build from live sources
        run: python3 scripts/build.py
      - name: Test (links, JSON-LD, sitemap)
        run: python3 scripts/test.py
      - name: Deploy Cloudflare Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          branch=newsletter
          if [ "$branch" = "main" ]; then
            echo "Refusing to deploy the production branch."
            exit 1
          fi
          npx --yes wrangler@3 pages deploy dist --project-name=campconditions --branch="$branch"
