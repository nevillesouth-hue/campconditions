name: Preview parksvic closures batch 1
on:
  push:
    branches: [cursor/parksvic-closures-batch1]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: preview-parksvic-closures-batch1
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/cursor/parksvic-closures-batch1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/.parksvic-cache
          key: parksvic-pages-${{ github.run_id }}
          restore-keys: parksvic-pages-
      - name: Build from live sources
        run: python3 scripts/build.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/.parksvic-cache
          key: parksvic-pages-${{ github.run_id }}
      - name: Test (links, JSON-LD, sitemap)
        run: python3 scripts/test.py
      - name: Deploy Cloudflare Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          branch=cursor/parksvic-closures-batch1
          if [ "$branch" = "main" ]; then
            echo "Refusing to deploy the production branch."
            exit 1
          fi
          npx --yes wrangler@3 pages deploy dist --project-name=campconditions --branch="$branch"
